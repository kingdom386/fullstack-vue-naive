services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: fullstack-vue-naive-server:latest
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
    ports:
      - '3000:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: fullstack-vue-naive-client:latest
    ports:
      - '8080:80'
    depends_on:
      - server
    restart: unless-stopped