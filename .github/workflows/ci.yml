name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: 类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（前后端）
        run: npm run lint

      - name: 构建（前后端）
        run: npm run build

  docker:
    name: 镜像构建校验
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: fullstack-vue-naive-server:ci

      - name: 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: false
          tags: fullstack-vue-naive-client:ci